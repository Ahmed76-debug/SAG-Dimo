<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - تسوق</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <script>(function(){try{var t=localStorage.getItem('ts_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo"><span>🏠</span> <span>تسوق </span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">الرئيسية</div>
          <a href="#dashboard" class="nav-item active" data-view="dashboard"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">إدارة الإعلانات</div>
          <a href="#listings" class="nav-item" data-view="listings"><i class="bi bi-megaphone"></i> جميع الإعلانات</a>
          <a href="#pending" class="nav-item" data-view="pending"><i class="bi bi-clock-history"></i> بانتظار الموافقة <span class="badge" id="badgePending">0</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">المستخدمين</div>
          <a href="#users" class="nav-item" data-view="users"><i class="bi bi-people"></i> المستخدمين</a>
          <a href="#permissions" class="nav-item" data-view="permissions"><i class="bi bi-shield-lock"></i> الصلاحيات</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">النظام</div>
          <a href="#categories" class="nav-item" data-view="categories"><i class="bi bi-grid"></i> الأقسام</a>
          <a href="#transactions" class="nav-item" data-view="transactions"><i class="bi bi-cash-stack"></i> المعاملات والعمولة</a>
          <a href="#settings" class="nav-item" data-view="settings"><i class="bi bi-gear"></i> الإعدادات</a>
          <a href="#backup" class="nav-item" data-view="backup"><i class="bi bi-database-down"></i> النسخ الاحتياطي</a>
          <a href="#activity" class="nav-item" data-view="activity"><i class="bi bi-activity"></i> سجل النشاط</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="nav-item"><i class="bi bi-globe"></i> زيارة الموقع</a>
        <a href="#" id="adminLogout" class="nav-item"><i class="bi bi-box-arrow-right"></i> تسجيل الخروج</a>
      </div>
    </aside>
    <main class="main">
      <header class="main-header">
        <div style="display:flex;align-items:center;gap:.75rem">
          <button class="btn-icon sidebar-toggle" id="sidebarToggle" aria-label="القائمة"><i class="bi bi-list"></i></button>
          <div class="header-search">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="بحث سريع...">
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="themeToggle"><i class="bi bi-moon-stars"></i></button>
          <div class="admin-user">
            <div class="avatar">م</div>
            <div>
              <div style="font-weight:600" id="adminName">المدير</div>
              <div style="font-size:.8rem;color:var(--text-2)" id="adminRole">admin</div>
            </div>
          </div>
        </div>
      </header>
      <div class="content" id="content">
        <!-- views loaded by JS -->
      </div>
    </main>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="js/admin.js"></script>
</body>
</html>

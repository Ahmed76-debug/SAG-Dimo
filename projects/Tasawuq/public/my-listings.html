<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعلاناتي - تسوق</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/user-pages.css">
  <script>(function(){try{var t=localStorage.getItem('ts_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-mark">🏠</span><span class="logo-text">تسوق </span></a>
      <nav class="nav">
        <a href="/" class="nav-link"><i class="bi bi-house-door"></i> الرئيسية</a>
        <a href="/listings.html" class="nav-link"><i class="bi bi-grid"></i> الإعلانات</a>
      </nav>
      <div class="header-actions">
        <button class="btn-icon" id="themeToggle"><i class="bi bi-moon-stars"></i></button>
        <a href="/add-listing.html" class="btn btn-primary"><i class="bi bi-plus-circle"></i> أضف إعلان</a>
        <div class="user-menu" id="userMenu" style="display:none">
          <button class="btn btn-ghost"><i class="bi bi-person-circle"></i> <span id="userName">حسابي</span> <i class="bi bi-chevron-down"></i></button>
          <div class="dropdown">
            <a href="/my-listings.html"><i class="bi bi-card-list"></i> إعلاناتي</a>
            <a href="/favorites.html"><i class="bi bi-heart"></i> المفضلة</a>
            <a href="/messages.html"><i class="bi bi-chat-dots"></i> الرسائل</a>
            <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="user-wrap">
    <div class="container">
      <div class="user-page-head">
        <h1><i class="bi bi-card-list"></i> إعلاناتي</h1>
        <a href="/add-listing.html" class="btn btn-primary"><i class="bi bi-plus-circle"></i> إضافة إعلان</a>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div class="tabs-nav" id="tabsNav">
        <button class="tab-btn active" data-status="all">الكل</button>
        <button class="tab-btn" data-status="pending">قيد المراجعة</button>
        <button class="tab-btn" data-status="approved">منشور</button>
        <button class="tab-btn" data-status="rejected">مرفوض</button>
        <button class="tab-btn" data-status="sold">مباع</button>
      </div>
      <div id="listingsWrap"></div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/my-listings.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة - تسوق</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){try{var t=localStorage.getItem('ts_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <style>
    .page-content { padding: 3rem 0 5rem; min-height: 60vh; }
    .page-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2.5rem; max-width: 900px; margin: 0 auto; }
    .page-box h1 { font-size: 2rem; margin-bottom: 1rem; }
    .page-box p { color: var(--text-2); line-height: 1.9; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-mark">🏠</span><span class="logo-text">تسوق </span></a>
      <nav class="nav"><a href="/" class="nav-link"><i class="bi bi-house-door"></i> الرئيسية</a><a href="/listings.html" class="nav-link"><i class="bi bi-grid"></i> الإعلانات</a></nav>
      <div class="header-actions"><button class="btn-icon" id="themeToggle"><i class="bi bi-moon-stars"></i></button></div>
    </div>
  </header>
  <main class="page-content">
    <div class="container"><div class="page-box" id="pageBox">جاري التحميل...</div></div>
  </main>
  <script>
    const slug = new URLSearchParams(location.search).get('slug')||'about';
    fetch('/api/pages/'+slug).then(r=>r.json()).then(d=>{
      if(d.page){ document.getElementById('pageBox').innerHTML = `<h1>${d.page.title}</h1>`+(d.page.content||''); document.title = d.page.title+' - تسوق'; }
      else document.getElementById('pageBox').innerHTML = '<h1>الصفحة غير موجودة</h1>';
    }).catch(()=>{ document.getElementById('pageBox').innerHTML = '<h1>خطأ في التحميل</h1>'; });
  </script>
</body>
</html>

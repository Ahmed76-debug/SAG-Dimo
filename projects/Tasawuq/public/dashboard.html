<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - تسوق</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/user-pages.css">
  <script>(function(){try{var t=localStorage.getItem('ts_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-mark">🏠</span><span class="logo-text">تسوق </span></a>
      <nav class="nav"><a href="/" class="nav-link"><i class="bi bi-house-door"></i> الرئيسية</a><a href="/listings.html" class="nav-link"><i class="bi bi-grid"></i> الإعلانات</a></nav>
      <div class="header-actions">
        <button class="btn-icon" id="themeToggle"><i class="bi bi-moon-stars"></i></button>
        <a href="/add-listing.html" class="btn btn-primary"><i class="bi bi-plus-circle"></i> أضف إعلان</a>
        <div class="user-menu" id="userMenu" style="display:none">
          <button class="btn btn-ghost"><i class="bi bi-person-circle"></i> <span id="userName">حسابي</span> <i class="bi bi-chevron-down"></i></button>
          <div class="dropdown">
            <a href="/my-listings.html"><i class="bi bi-card-list"></i> إعلاناتي</a>
            <a href="/favorites.html"><i class="bi bi-heart"></i> المفضلة</a>
            <a href="/messages.html"><i class="bi bi-chat-dots"></i> الرسائل</a>
            <a href="/admin.html" id="adminLink" style="display:none"><i class="bi bi-shield-lock"></i> لوحة الإدارة</a>
            <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="user-wrap">
    <div class="container">
      <div class="user-page-head"><h1><i class="bi bi-speedometer2"></i> لوحة التحكم</h1></div>
      <div class="stats-row" id="statsRow"></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem">
        <a href="/add-listing.html" class="mini-stat" style="display:block">
          <div style="font-size:2rem">➕</div>
          <div class="num" style="font-size:1.1rem">أضف إعلان جديد</div>
          <div class="lbl">انشر إعلانك مجانًا</div>
        </a>
        <a href="/my-listings.html" class="mini-stat" style="display:block">
          <div style="font-size:2rem">📋</div>
          <div class="num" style="font-size:1.1rem">إعلاناتي</div>
          <div class="lbl">إدارة إعلاناتك</div>
        </a>
        <a href="/favorites.html" class="mini-stat" style="display:block">
          <div style="font-size:2rem">❤️</div>
          <div class="num" style="font-size:1.1rem">المفضلة</div>
          <div class="lbl">الإعلانات المحفوظة</div>
        </a>
        <a href="/messages.html" class="mini-stat" style="display:block">
          <div style="font-size:2rem">💬</div>
          <div class="num" style="font-size:1.1rem">الرسائل</div>
          <div class="lbl">تواصل مع البائعين</div>
        </a>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    if(!token) location.href='/login.html';
    if(user && (user.role==='admin'||user.role==='moderator')) document.getElementById('adminLink').style.display='flex';
    async function load(){
      try{
        const [l,f,m] = await Promise.all([
          fetch('/api/my/listings',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()),
          fetch('/api/favorites',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()),
          fetch('/api/messages',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()),
        ]);
        const rows = l.rows||[];
        document.getElementById('statsRow').innerHTML = `
          <div class="mini-stat"><div class="num">${rows.length}</div><div class="lbl">إعلاناتي</div></div>
          <div class="mini-stat"><div class="num">${rows.filter(x=>x.status==='approved').length}</div><div class="lbl">منشورة</div></div>
          <div class="mini-stat"><div class="num">${(f.rows||[]).length}</div><div class="lbl">المفضلة</div></div>
          <div class="mini-stat"><div class="num">${(m.rows||[]).length}</div><div class="lbl">الرسائل</div></div>
        `;
      }catch(e){}
    }
    load();
  </script>
</body>
</html>

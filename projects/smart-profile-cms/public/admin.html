<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم SMART ACTIVITY GROUP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{background:#0b1220;color:#e2e8f0}
    .admin-shell{display:none;height:100vh}
    .admin-sidebar{width:240px;background:#0f172a;border-inline-end:1px solid #1e293b;padding:18px;overflow:auto}
    .admin-sidebar h2{font-size:14px;color:#94a3b8;margin-bottom:14px}
    .side-link{display:block;width:100%;text-align:start;background:transparent;border:0;color:#cbd5e1;padding:10px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px}
    .side-link:hover{background:#1e293b}
    .side-link.active{background:var(--grad);color:#fff;font-weight:700}
    .admin-main{flex:1;display:flex;flex-direction:column}
    .admin-top{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #1e293b;background:#0f172a}
    .admin-top h1{font-size:18px;font-weight:800}
    .admin-content{padding:24px;overflow:auto;flex:1}
    .login-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 50% 0%,rgba(6,182,212,.2),transparent 70%),#0b1220}
    .login-card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:36px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .login-card h2{margin-bottom:8px;font-size:24px;font-weight:800}
    .login-card p{color:#94a3b8;margin-bottom:20px}
    .m-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #1e293b;background:#020617;color:#e2e8f0;font-family:inherit;margin:6px 0 12px;font-size:14px}
    .file-picker{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed #334155;border-radius:10px;background:#020617;cursor:pointer;transition:.2s}
    .file-picker:hover{border-color:var(--accent);background:#0b1220}
    .file-picker-btn{background:var(--grad);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
    .file-picker-name{color:#94a3b8;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    label{display:block;font-size:13px;color:#94a3b8;margin-top:8px}
    .field-row{margin-bottom:12px}
    .btn-primary-dark{background:var(--grad);color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:700;font-family:inherit}
    .btn-ghost-dark{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:inherit}
    .btn-sm{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px}
    .btn-danger{background:#7f1d1d;color:#fecaca;border-color:#991b1b}
    .panel-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .panel-toolbar h2{font-size:20px;font-weight:800}
    .entity-list{display:grid;gap:12px}
    .entity-item{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .entity-title{font-weight:700;font-size:15px}
    .entity-sub{font-size:13px;color:#94a3b8;margin-top:2px}
    .entity-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
    .card-admin{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:16px;margin-bottom:12px}
    .cat-admin-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
    .subitems-admin{padding-inline-start:16px;display:grid;gap:6px;margin-bottom:10px}
    .sub-row{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#020617;padding:6px 10px;border-radius:8px;font-size:13px}
    .sub-add{display:flex;gap:8px}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .values-grid{display:flex;flex-wrap:wrap;gap:8px}
    .empty{color:#94a3b8;padding:12px}
    .loading{color:#94a3b8}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:200}
    .modal{background:#0f172a;border:1px solid #1e293b;border-radius:16px;width:min(640px,92vw);max-height:90vh;overflow:auto}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #1e293b}
    .modal-head h3{font-size:17px;font-weight:800}
    .modal-close{background:transparent;border:0;color:#94a3b8;font-size:20px;cursor:pointer}
    .modal-body{padding:20px}
    .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #1e293b}
    .modal-body label{display:block;margin-bottom:12px}
    .modal-body .m-input{margin:6px 0 0}
    @media(max-width:900px){.admin-shell{flex-direction:column}.admin-sidebar{width:100%;height:auto;padding:12px}.admin-sidebar #sideNav{display:flex;flex-wrap:wrap;gap:6px}.admin-sidebar .side-link{width:auto;flex:1 1 auto;text-align:center;min-width:90px} .admin-top{flex-wrap:wrap;gap:10px} .admin-top h1{font-size:16px} .settings-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <!-- Login -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>Admin Login</h2>
      <p>لوحة تحكم SMART ACTIVITY GROUP</p>
      <label>Username</label>
      <input id="loginUser" class="m-input" value="admin" />
      <label>Password</label>
      <input id="loginPass" class="m-input" type="password" value="admin123" />
      <button id="loginBtn" class="btn-primary-dark" style="width:100%;margin-top:8px">Login</button>
      <div id="loginErr" style="color:#fecaca;margin-top:10px;font-size:13px"></div>
      <div style="color:#64748b;font-size:12px;margin-top:16px">Default credentials: admin / admin123 (change in production)</div>
    </div>
  </div>

  <!-- Admin app -->
  <div id="adminApp" class="admin-shell" style="display:none">
    <div class="admin-sidebar">
      <h2>PANELS</h2>
      <div id="sideNav"></div>
      <button id="logoutBtn" class="btn-ghost-dark" style="width:100%;margin-top:20px">Logout</button>
    </div>
    <div class="admin-main">
      <div class="admin-top">
        <h1>لوحة التحكم — SMART ACTIVITY GROUP</h1>
        <button id="viewSiteBtn" class="btn-ghost-dark" type="button">عرض الموقع</button>
      </div>
      <div class="admin-content" id="contentArea"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="/admin.js"></script>
</body>
</html>

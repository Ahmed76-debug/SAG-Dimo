    <g transform="translate(880,130)">
      <rect x="-28" y="-11" width="56" height="15" rx="5" fill="#ffffff" fill-opacity=".16"/>
      <path d="M-23 6 L-150 380 L150 380 L23 6 Z" fill="url(#cone)"/>
    </g>
  </g>

  <!-- ===== الأرضية ===== -->
  <path d="M0 470 H1200 V700 H0 Z" fill="url(#floor)"/>
  <g stroke="#ffffff" stroke-opacity=".09" stroke-width="1.5">

    <path d="M200 62 V130 M400 44 V130 M600 34 V130 M800 44 V130 M1000 62 V130"/>
    <path d="M40 130 V660 M1160 130 V660"/>
    <path d="M40 300 H1160" stroke-opacity=".07"/>
  </g>

  <!-- ===== كشافات الإضاءة ===== -->
  <g>
    <g transform="translate(320,130)">
      <rect x="-28" y="-11" width="56" height="15" rx="5" fill="#ffffff" fill-opacity=".16"/>
      <path d="M-23 6 L-150 380 L150 380 L23 6 Z" fill="url(#cone)"/>
    </g>
    <g transform="translate(600,130)">
      <rect x="-32" y="-11" width="64" height="16" rx="5" fill="#ffffff" fill-opacity=".2"/>
      <path d="M-27 6 L-185 420 L185 420 L27 6 Z" fill="url(#coneA)"/>

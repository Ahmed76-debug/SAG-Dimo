<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلباتك — لوحة التحكم</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛵%3C/text%3E%3C/svg%3E">
<script>
  (function(){ var t = localStorage.getItem('tb_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="app" class="hidden">
  <div id="side-overlay"></div>
  <aside id="sidebar">
    <div class="brand">
      <img id="brand-logo" src="" alt="">
      <div class="brand-txt"><b id="brand-name" class="brand-name-aldhabi">طلباتك</b></div>
      <button id="side-close" class="btn btn-ghost btn-icon" title="إغلاق">✕</button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a href="/" target="_self" class="btn btn-soft btn-block">🛍️ متجر العملاء</a>
    </div>
  </aside>
  <div id="mainwrap">
    <header id="topbar">
      <button id="menu-btn" class="btn btn-ghost btn-icon" title="القائمة">☰</button>
      <div id="page-title" class="grow">لوحة التحكم</div>
      <div class="flex">
        <button id="theme-btn" class="btn btn-ghost btn-icon" title="معرض الثيمات" aria-label="معرض الثيمات"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.48 2 2 6.48 2 12c0 5.08 3.78 9.27 8.67 9.93.61.08 1.13-.43 1.02-1.04-.11-.56-.42-1.36-1.15-2.13-.63-.66-.99-1.55-.88-2.52.18-1.54 1.55-2.74 3.1-2.74H15c3.31 0 6-2.69 6-6 0-4.97-4.03-9-9-9z"/></svg></button>
        <div class="dropdown">
          <button id="user-btn" class="btn btn-ghost"><span class="avatar" id="user-avatar">؟</span><span id="user-name" class="hide-sm">—</span></button>
          <div id="user-menu" class="dropdown-menu card pad-0 hidden">
            <div class="menu-item muted" id="user-role"></div>
            <div class="sep" style="margin:6px 0"></div>
            <button class="menu-item" id="change-pass-btn">🔑 تغيير كلمة المرور</button>
            <button class="menu-item" id="my-sessions-btn">📱 الأجهزة المسجّلة</button>
            <div class="sep" style="margin:6px 0"></div>
            <button class="menu-item" id="logout-btn">🚪 تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="login" class="login-wrap">
  <form id="login-form" class="card login-card">
    <div class="login-logo" id="login-logo">🛵</div>
    <h2 id="login-brand" class="brand-name-aldhabi">طلباتك</h2>
    <p class="muted" style="margin-top:-6px">نظام إدارة التوصيل والـ ERP المتكامل</p>
    <div class="field"><label>اسم المستخدم</label><input class="input" type="text" id="login-email" value="admin" required autocomplete="username"></div>
    <div class="field" style="position:relative"><label>كلمة المرور</label><input class="input" type="password" id="login-pass" value="admin123" required autocomplete="current-password" style="padding-inline-end:42px"><button type="button" id="toggle-login-pass" class="btn btn-ghost icon-btn" style="position:absolute;inset-inline-end:6px;bottom:6px;padding:4px 8px" aria-label="إظهار كلمة المرور">👁</button></div>
    <button class="btn btn-primary btn-block" type="submit">تسجيل الدخول</button>
    <div class="sep"></div>
    <div class="muted" style="font-size:.82rem">بيانات الدخول الافتراضية: admin / admin123</div>
  </form>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/js/admin/core.js"></script>
<script src="/js/admin/export.js"></script>
<script src="/js/admin/modules.js"></script>
<script src="/js/admin/erp.js"></script>
<script src="/js/admin/views.js"></script>
<script src="/js/admin/backup.js"></script>
<script src="/js/admin/data-tools.js"></script>
</body>
</html>
